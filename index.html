<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e9e1d2"><title>소소도예 | 손끝으로 빚는 물레</title>
<style>
:root{--ink:#3c332b;--muted:#82766a;--cream:#fbf6ec;--green:#347a59;--gold:#d3a64e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e1d2;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:manipulation}.app{position:relative;width:min(100vw,480px);height:100dvh;min-height:620px;margin:auto;overflow:hidden;background:linear-gradient(#d6e5df 0 37%,#eee8da 37% 74%,#c29361 74%);display:flex;flex-direction:column}.top{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:14px;letter-spacing:-.5px}.level,.coin{background:#fff9eddf;border:1px solid #fff;border-radius:20px;padding:7px 11px;font-size:11px;font-weight:850;box-shadow:0 3px 10px #49391a12}.coin b{color:#a57821}.scene{position:absolute;inset:0 0 178px;overflow:hidden}.window{position:absolute;left:6%;right:6%;top:10%;height:24%;background:linear-gradient(#9ec9c6 0 68%,#94aa7f 68%);border:9px solid #976f4e;border-radius:4px;box-shadow:inset 0 0 0 3px #d0a576}.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:7px;background:#976f4e}.window:after{content:"";position:absolute;left:0;right:0;top:61%;height:6px;background:#976f4e}.sun{position:absolute;right:17%;top:14%;width:28px;height:28px;border-radius:50%;background:#f4d17a;box-shadow:0 0 0 7px #f4d17a44}.shelf{position:absolute;right:6%;top:39%;width:38%;height:8px;background:#94623e;box-shadow:0 47px #94623e}.shelf:before{content:"🏺　🫖";position:absolute;top:-31px;left:5px;font-size:20px;white-space:pre}.plant{position:absolute;left:7%;top:43%;font-size:38px}.wall{position:absolute;top:37%;bottom:0;left:0;right:0;background:linear-gradient(90deg,#00000007 1px,transparent 1px),linear-gradient(#00000008 1px,transparent 1px),#eee8da;background-size:36px 36px}.stagecard{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 58px);left:16px;right:16px;background:#fffaf1ed;border:1px solid white;border-radius:16px;padding:11px 13px;box-shadow:0 5px 16px #43352318}.stepname{display:flex;align-items:center;gap:8px}.stepnum{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e6d6b6;color:#665039;font-size:11px;font-weight:900}.stagecard strong{font-size:14px}.stagecard p{margin:5px 0 0 33px;color:#74695c;font-size:11px;line-height:1.45}.meter{height:5px;border-radius:8px;background:#e5ddcf;margin:9px 1px 0 33px;overflow:hidden}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#75a77a,#347a59);transition:width .15s}.canvaswrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.wheelcanvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;z-index:2;bottom:13px;left:50%;transform:translateX(-50%);background:#403a32dc;color:#fff8e9;border-radius:18px;padding:8px 13px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px #21190e26}.controls{position:absolute;z-index:4;bottom:0;left:0;right:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(#fbf7ef00,#fbf7ef 20%)}.controlcard{background:#fffaf0;border:1px solid white;border-radius:19px;padding:12px;box-shadow:0 4px 17px #5a43241a}.speedrow{display:flex;align-items:center;gap:9px;margin:0 2px 10px;color:#6f6457;font-size:10px;font-weight:850}.speedrow input{flex:1;accent-color:var(--green);height:18px}.speedrow b{min-width:34px;text-align:right;color:#4d6d4e}.actions{display:flex;gap:8px}.action{height:48px;border:0;border-radius:14px;background:#e9e1d2;color:#65594c;font-size:13px;font-weight:900;padding:0 14px}.action.primary{flex:1;background:var(--green);color:white;box-shadow:0 4px 0 #24593f}.action:disabled{opacity:.45}.action.sub{background:#efe6d3}.micro{font-size:9px;color:#887c6e;text-align:center;margin-top:8px}.toast{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);background:#35342de8;color:white;padding:12px 17px;border-radius:15px;font-weight:900;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}.complete{position:absolute;z-index:8;inset:0;background:#342d2388;display:none;align-items:center;justify-content:center;padding:24px}.complete.show{display:flex}.completebox{width:100%;border-radius:22px;background:#fff9ed;padding:22px;text-align:center;box-shadow:0 12px 40px #24180e44}.completebox .cup{font-size:54px}.completebox h2{margin:4px 0 7px;font-size:21px}.completebox p{margin:0 0 16px;color:#786d60;font-size:12px;line-height:1.6}.completebox button{width:100%;border:0;background:var(--green);color:white;border-radius:14px;padding:13px;font-weight:900;font-size:14px}.footer-note{font-size:9px;color:#897e70;margin-top:9px}@media(min-width:700px){.app{height:min(100dvh,900px);min-height:680px;margin:0 auto;box-shadow:0 0 50px #59462b22}}
</style></head><body><main class="app"><header class="top"><div class="brand">소소도예 <span style="color:#9b7950">· 손끝으로 빚는 물레</span></div><div class="level">공방 Lv. 1</div><div class="coin">✦ <b id="coins">240</b></div></header><section class="scene"><div class="window"></div><div class="sun"></div><div class="wall"></div><div class="shelf"></div><div class="plant">🪴</div><div class="canvaswrap"><canvas class="wheelcanvas" id="wheel"></canvas></div><div class="hint" id="hint">흙덩이를 물레 한가운데 놓고 시작해요</div></section><section class="stagecard"><div class="stepname"><span class="stepnum" id="stepnum">1</span><strong id="title">흙덩이 중심 잡기</strong></div><p id="instruction">흔들리는 흙의 가운데를 손가락으로 꾹 누르고 있어요.</p><div class="meter"><i id="fill"></i></div></section><section class="controls"><div class="controlcard"><div class="speedrow"><span>물레 속도</span><input id="speed" type="range" min="1" max="5" value="3" aria-label="물레 속도"><b id="speedval">보통</b></div><div class="actions"><button class="action sub" id="reset">다시 빚기</button><button class="action primary" id="next" disabled>흙 중심 잡기</button></div><div class="micro" id="micro">손가락을 떼면 진행이 잠시 멈춰요 · 물레는 계속 돌아갑니다</div></div></section><div class="toast" id="toast"></div><div class="complete" id="complete"><div class="completebox"><div class="cup">🏺</div><h2>내 손으로 빚은 첫 작품</h2><p>흙덩이에서 시작해 중심을 잡고, 구멍을 내고, 벽을 끌어올렸어요.<br>물레의 회전과 손끝의 압력으로 완성한 작품이에요.</p><button id="again">새 흙덩이로 다시 빚기</button><div class="footer-note">소소도예 공방</div></div></div></main>
<script>
(()=>{const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let W=420,H=740,dpr=1,step=0,progress=0,rotation=0,speed=3,pressed=false,lastY=0,lastX=0,shape=0,coins=240,toastTimer;const names=['흙덩이 중심 잡기','가운데를 열어 바닥 만들기','벽을 위로 끌어올리기','손끝으로 형태 다듬기'],instructions=['흔들리는 흙의 가운데를 손가락으로 꾹 누르고 있어요.','흙 중심을 꾹 누른 채 아래로 천천히 밀어 구멍을 내요.','손가락을 바깥 벽에 대고 위로 길게 끌어올려요.','벽을 살짝 바깥쪽으로 밀어 나만의 형태를 만들어요.'],actions=['흙 중심 잡기','가운데 열기','벽 끌어올리기','형태 다듬기'],hints=['흙덩이 가운데를 2초간 눌러 중심을 잡아요','가운데를 누르고 아래로 드래그해요','벽을 누르고 위로 쭉 끌어올려요','벽을 좌우로 움직여 모양을 다듬어요'];function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}window.addEventListener('resize',resize);resize();function pathClay(baseY){const wob=(step===0?(1-progress/100)*10:0)*Math.sin(rotation*2.2),cx=210+wob,base=step===0?50:step===1?53:step===2?55+shape*9:58+shape*15,height=step===0?122:step===1?112:step===2?130+progress*1.02:210,top=baseY-height;ctx.beginPath();if(step===0){ctx.moveTo(cx-base,baseY);ctx.bezierCurveTo(cx-base*1.12,baseY-20,cx-base*.95,top+18,cx-14,top+2);ctx.bezierCurveTo(cx-2,top-4,cx+8,top+5,cx+base*.7,top+22);ctx.bezierCurveTo(cx+base*1.05,top+42,cx+base*.98,baseY-20,cx+base,baseY);ctx.closePath();return{cx,baseY,top,base,height}}if(step===1){ctx.moveTo(cx-base,baseY);ctx.bezierCurveTo(cx-base*1.02,baseY-25,cx-base*.82,top+12,cx-31,top+12);ctx.quadraticCurveTo(cx-22,top+8,cx-19,top+31);ctx.lineTo(cx-17,baseY-19);ctx.quadraticCurveTo(cx,baseY-14,cx+17,baseY-19);ctx.lineTo(cx+19,top+31);ctx.quadraticCurveTo(cx+22,top+8,cx+31,top+12);ctx.bezierCurveTo(cx+base*.82,top+12,cx+base*1.02,baseY-25,cx+base,baseY);ctx.closePath();return{cx,baseY,top,base,height}}let neck=step===2?32:35+shape*5,bulge=step===2?base+13:base+shape*7;ctx.moveTo(cx-base,baseY);ctx.bezierCurveTo(cx-base*.94,baseY-40,cx-bulge,baseY-height*.28,cx-neck,baseY-height*.53);ctx.bezierCurveTo(cx-neck+3,top+32,cx-neck+2,top+10,cx-neck+8,top+7);ctx.lineTo(cx+neck-8,top+7);ctx.bezierCurveTo(cx+neck-2,top+10,cx+neck,top+32,cx+neck,baseY-height*.53);ctx.bezierCurveTo(cx+bulge,baseY-height*.28,cx+base*.94,baseY-40,cx+base,baseY);ctx.closePath();return{cx,baseY,top,base,height}}function draw(){ctx.clearRect(0,0,W,H);const baseY=H*.735,centerX=W/2;ctx.fillStyle='#c39564';ctx.fillRect(0,H*.77,W,H*.23);ctx.strokeStyle='#9e714c33';ctx.lineWidth=1;for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,H*.77);ctx.lineTo(x,H);ctx.stroke()}for(let y=H*.82;y<H;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.save();ctx.translate(centerX,baseY+13);ctx.rotate(rotation);ctx.fillStyle='#77533c';ctx.beginPath();ctx.ellipse(0,15,124,24,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a17a55';ctx.beginPath();ctx.ellipse(0,0,124,23,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d1b38a';ctx.lineWidth=2;for(let r=23;r<120;r+=23){ctx.beginPath();ctx.ellipse(0,0,r,r*.185,0,0,Math.PI*2);ctx.stroke()}ctx.strokeStyle='#ead8b7';ctx.lineWidth=3;for(let a=0;a<Math.PI*2;a+=Math.PI/5){ctx.beginPath();ctx.ellipse(0,0,110,19,a,0,.11);ctx.stroke()}ctx.restore();ctx.fillStyle='#79563e';ctx.beginPath();ctx.moveTo(centerX-18,baseY+30);ctx.lineTo(centerX+18,baseY+30);ctx.lineTo(centerX+28,baseY+150);ctx.lineTo(centerX-28,baseY+150);ctx.closePath();ctx.fill();ctx.fillStyle='#986f4e';ctx.beginPath();ctx.ellipse(centerX,baseY+150,80,15,0,0,Math.PI*2);ctx.fill();const clay=pathClay(baseY);ctx.fillStyle='#593f2b33';ctx.beginPath();ctx.ellipse(clay.cx,baseY+4,clay.base*.92,9,0,0,Math.PI*2);ctx.fill();const grad=ctx.createLinearGradient(clay.cx-clay.base,0,clay.cx+clay.base,0);grad.addColorStop(0,'#a96648');grad.addColorStop(.22,'#c78662');grad.addColorStop(.47,'#e0ad85');grad.addColorStop(.68,'#d49a72');grad.addColorStop(1,'#9f6247');ctx.fillStyle=grad;ctx.strokeStyle='#905a43';ctx.lineWidth=2;ctx.fill();ctx.stroke();const hx=clay.cx+Math.sin(rotation*1.45)*clay.base*.42;ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#fff0d7';ctx.beginPath();ctx.ellipse(hx,clay.top+clay.height*.48,7,clay.height*.31,.04,0,Math.PI*2);ctx.fill();ctx.restore();if(step>=1){ctx.fillStyle='#684534';ctx.beginPath();ctx.ellipse(clay.cx,clay.top+12,step===1?20:34,step===1?6:8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f0c49d';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(clay.cx,clay.top+8,step===1?22:36,7,0,Math.PI,Math.PI*2);ctx.stroke()}if(step===0&&progress<100){ctx.strokeStyle='#bf7055aa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(centerX,baseY-78,clay.base+13,rotation,rotation+1.3);ctx.stroke()}if(pressed){ctx.fillStyle='#fff8edbb';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(lastX,lastY,17,0,Math.PI*2);ctx.fill();ctx.stroke()}if(step===0&&pressed){progress=Math.min(100,progress+.38);$('fill').style.width=progress+'%';$('next').disabled=progress<100;$('next').textContent=progress>=100?'다음 단계 →':actions[step];if(progress>=100){pressed=false;showToast('흙이 물레 중심에 안정적으로 자리 잡았어요')}}rotation+=.016+speed*.007;requestAnimationFrame(draw)}draw();function updateUI(){$('stepnum').textContent=step+1;$('title').textContent=names[step];$('instruction').textContent=instructions[step];$('fill').style.width=progress+'%';$('next').textContent=progress>=100?(step===3?'작품 완성하기 ✿':'다음 단계 →'):actions[step];$('next').disabled=progress<100;$('hint').textContent=hints[step];$('micro').textContent=step===0?'흙이 덜 흔들릴 때까지 꾹 눌러요 · 물레는 계속 돌아갑니다':step===1?'바닥 두께를 남기고, 가운데를 깊게 열어요':step===2?'한 번에 확 당기지 말고 천천히 여러 번 올려요':'좌우로 조금씩 밀어 원하는 배와 목을 만들어요'}function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1400)}let lastYprev=0,lastXprev=0;function pointerDown(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,baseY=H*.735;if(y<baseY-150||y>baseY+4)return;canvas.setPointerCapture(e.pointerId);pressed=true;lastX=x;lastY=y;lastYprev=y;lastXprev=x}function pointerMove(e){if(!pressed)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,dy=y-lastYprev,dx=x-lastXprev;lastX=x;lastY=y;if(step===0){if(Math.abs(x-W/2)<95)progress=Math.min(100,progress+.75);if(progress>=100){pressed=false;showToast('흙이 물레 중심에 안정적으로 자리 잡았어요')}}else if(step===1){if(Math.abs(x-W/2)<70&&dy>0)progress=Math.min(100,progress+dy*.8);if(progress>=100){pressed=false;showToast('가운데가 열렸어요 · 바닥을 남겼어요')}}else if(step===2){if(Math.abs(x-W/2)>22&&dy<0){progress=Math.min(100,progress+(-dy)*.75);shape=Math.min(1,progress/100)}if(progress>=100){pressed=false;showToast('벽이 올라왔어요 · 이제 형태를 만들어요')}}else{if(Math.abs(x-W/2)>20){shape=Math.max(-.5,Math.min(1.2,shape+dx*.008));progress=Math.min(100,progress+Math.abs(dx)*.52)}if(progress>=100){pressed=false;showToast('손끝으로 형태를 다듬었어요')}}lastYprev=y;lastXprev=x;$('fill').style.width=progress+'%';$('next').disabled=progress<100;$('next').textContent=progress>=100?(step===3?'작품 완성하기 ✿':'다음 단계 →'):actions[step]}function pointerUp(){pressed=false}canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);$('next').addEventListener('click',()=>{if(progress<100)return;if(step<3){step++;progress=0;shape=0;updateUI()}else{$('complete').classList.add('show');coins+=120;$('coins').textContent=coins;showToast('첫 작품 완성! +120 포인트')}});$('reset').addEventListener('click',()=>{step=0;progress=0;shape=0;$('complete').classList.remove('show');updateUI();showToast('새 흙덩이를 물레에 올렸어요')});$('again').addEventListener('click',()=>{$('complete').classList.remove('show');step=0;progress=0;shape=0;updateUI()});$('speed').addEventListener('input',e=>{speed=+e.target.value;$('speedval').textContent=['','느리게','천천히','보통','빠르게','아주 빠르게'][speed]});updateUI()})();
</script></body></html>
