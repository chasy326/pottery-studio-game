<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2724">
<title>흙마루</title>
<link rel="stylesheet" href="/style.css?v=11">
</head>
<body>
<div id="loading"><div class="ld"><span class="mark">흙</span><b>흙마루</b><p>공방을 여는 중…</p><i></i></div></div>
<div id="world" aria-label="흙마루 3D 작업실"></div>

<header class="top">
  <div class="brand"><span class="mark">흙</span><b>흙마루</b></div>
  <nav class="rooms" id="rooms" aria-label="방 이동"></nav>
  <div class="topR"><div class="place"><i class="dot"></i><span id="placeName">물레 작업실</span></div><button class="mini" id="changeChar">캐릭터 바꾸기</button></div>
</header>

<div class="nametag" id="nametag" hidden></div>
<div class="hint" id="hint">바닥을 누르거나 WASD로 걸어요</div>
<div class="bubble" id="bubble" hidden></div>

<nav class="dock" id="dock">
  <button class="pill act" id="waveBtn" title="손 흔들기 (1)">👋<small>인사</small></button>
  <button class="pill act" id="bowBtn" title="꾸벅 인사 (2)">🙇<small>꾸벅</small></button>
  <button class="pill primary" id="sitBtn" hidden>🏺 도자기 빚기</button>
  <button class="pill primary" id="galleryBtn" hidden>🖼 빈 받침대에 놓기</button>
  <button class="pill" id="carryBtn" hidden>작업대에 두기 <small>Q</small></button>
  <button class="pill soon" id="soonBtn" hidden>곧 열려요</button>
  <button class="pill" id="craftBtn" hidden>🔥</button>
</nav>

<div class="pick" id="pick" hidden>
  <div class="pickCard">
    <h2>누구로 빚을까요?</h2>
    <p>공방에서 함께할 도예가를 골라 주세요</p>
    <div class="pickRow">
      <button class="who" data-k="A"><img alt="바가지머리 도예가"><span>바가지머리</span></button>
      <button class="who" data-k="B"><img alt="단발머리 도예가"><span>단발머리</span></button>
    </div>
    <div class="myname">내 이름 <b id="myName"></b> <button class="mini" id="reroll">🎲 다른 이름</button></div>
  </div>
</div>

<script src="/three.min.js"></script>
<script src="/char3d.js?v=3"></script>
<script src="/craft.js?v=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="/net-config.js?v=1"></script>
<script src="/studio.js?v=32"></script>
<script src="/throw.js?v=12"></script>
</body>
</html>
